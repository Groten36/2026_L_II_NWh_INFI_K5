version: 2.1 

 

jobs: 

  build-and-test:  

    machine: 

      image: ubuntu-2004:current 

        

    steps: 

      - checkout 
     
      - run: pip install -r requirements.txt
      - run: pip install -r test_requirements.txt 
      - run: 
            command: make run
            background: true

      - run: make deps
      - run: make lint 

      - run: make test       

      - run: make docker_build
workflows: 

  basic:  

    jobs: 

      - build-and-test
